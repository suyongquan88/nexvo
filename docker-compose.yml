services:
  postgres:
    image: postgres:16-alpine
    container_name: nexvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexvo
      POSTGRES_PASSWORD: nexvo
      POSTGRES_DB: nexvo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexvo -d nexvo"]
      interval: 5s
      timeout: 5s
      retries: 5

  nexvo:
    build: .
    container_name: nexvo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://nexvo:nexvo@postgres:5432/nexvo

volumes:
  postgres_data:
